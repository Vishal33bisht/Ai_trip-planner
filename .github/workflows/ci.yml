name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-checks:
    name: Backend Lint & Database Validation
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ai_trip_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install System & Python Dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y libpq-dev gcc
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Verify Python Code & Schema Initialization
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ai_trip_test
          SECRET_KEY: test-secret-key-for-ci
          GEMINI_API_KEY: fake-key-for-testing
        run: |
          cd backend
          python -m compileall app/
          python -c "from app.database import init_db; init_db(); print('Database tables verified!')"

  frontend-checks:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: front-end/package-lock.json

      - name: Install Dependencies
        run: |
          cd front-end
          npm ci || npm install

      - name: Lint Frontend
        run: |
          cd front-end
          npm run lint

      - name: Build Frontend
        env:
          VITE_API_BASE_URL: http://localhost:8000
        run: |
          cd front-end
          npm run build

  docker-build-verification:
    name: Docker Image Build Validation
    runs-on: ubuntu-latest
    needs: [backend-checks, frontend-checks]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Container
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: aitrip-backend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Frontend Container
        uses: docker/build-push-action@v5
        with:
          context: ./front-end
          file: ./front-end/Dockerfile
          push: false
          tags: aitrip-frontend:test
          build-args: |
            VITE_API_BASE_URL=http://localhost:8000
          cache-from: type=gha
          cache-to: type=gha,mode=max
